services:

##### Http Listener Kernel
  Austral\HttpBundle\Listener\HttpListener:
    arguments:
      $eventDispatcher:   "@event_dispatcher"
      $configuration:     "@austral.http.config"
      $httpRequest:       "@austral.http.request"
      $debug:             "@austral.tools.debug"
    tags:
      - { name: kernel.event_listener, event: kernel.request, method: onRequestInitialise, priority: 30 }
      - { name: kernel.event_listener, event: kernel.request, method: onRequest }
      - { name: kernel.event_listener, event: kernel.controller, method: onController }
      - { name: kernel.event_listener, event: kernel.response, method: onResponse, priority: -2048 }
      - { name: kernel.event_listener, event: kernel.exception, method: onException, priority: 2048 }
      - { name: kernel.event_listener, event: kernel.finish_request, method: onFinishRequest }

##### Http Services
  Austral\HttpBundle\Services\HttpRequest:
    arguments:
      $httpConfiguration: "@austral.http.config"

  austral.http.request:
    alias:          Austral\HttpBundle\Services\HttpRequest

##### Configuration
  Austral\HttpBundle\Configuration\HttpConfiguration:
    arguments:
      $config: "%austral_http%"

  austral.http.config:
    alias:      Austral\HttpBundle\Configuration\HttpConfiguration
    public:         true
